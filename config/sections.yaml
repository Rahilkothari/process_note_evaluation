sections:
- id: '1.1'
  name: Approval Matrix
  type: table
  fields:
  - Name
  - Role
  - Function
  - Sign
  - Date
  help_text: List the key individuals responsible for reviewing and approving this
    process note. This ensures accountability. You must include the Process Owner,
    Process Reviewer, and Process Approver.
  example: "Example: \nName: John Doe | Role: Process Owner | Function: HR Head |\
    \ Sign: JD | Date: 2023-10-01"
- id: '1.2'
  name: Document Change History
  type: table
  fields:
  - Version No.
  - Effective Date
  - Change Date
  - Change Request By
  - Change Made By
  - Amendment
  help_text: Track the versions of this document. If this is the first version, enter
    '1.0'. For future updates, briefly describe what changed in the 'Amendment' column.
  example: "Example: \nVersion No.: 1.0 | Effective Date: 2023-10-01 | Change Date:\
    \ 2023-10-01 | Change Request By: Jane Smith | Change Made By: John Doe | Amendment:\
    \ Initial Draft"
- id: '1.3'
  name: Document Review Cycle
  type: table
  fields:
  - Sr. No.
  - Effective Date
  - Next Review Date
  - Process Owner
  - Name
  - Sign
  help_text: Specify how often this process needs to be reviewed (e.g., annually)
    to ensure it stays up-to-date. Ensure the 'Next Review Date' is logically after
    the 'Effective Date'.
  example: "Example: \nSr. No.: 1 | Effective Date: 2023-10-01 | Next Review Date:\
    \ 2024-10-01 | Process Owner: John Doe | Name: John Doe | Sign: JD"
- id: '1.4'
  name: Related Documents
  type: table
  fields:
  - Process / Policy ID
  - Document Name
  help_text: List any other organizational policies, guidelines, or process notes
    that are relevant to this one. Do not use generic descriptions; provide the actual
    Document Name.
  example: "Example: \nProcess / Policy ID: POL-HR-01 | Document Name: Employee Onboarding\
    \ Policy"
- id: '1.5'
  name: Process Performance Parameters / KPIs
  type: table
  fields:
  - Sr. No.
  - Description
  - Owner
  - Target
  - Maker
  - Checker
  - Data Source
  - Report Name
  - Report Frequency
  - Review Frequency
  help_text: Define the Key Performance Indicators (KPIs) that measure the success
    of this process. A good KPI must be measurable (e.g., 'Turnaround time under 24
    hours') rather than vague (e.g., 'Improve efficiency').
  example: "Example: \nSr. No.: 1 | Description: Average Onboarding TAT | Owner: HR\
    \ Ops | Target: < 5 Days | Maker: Recruiter | Checker: HR Manager | Data Source:\
    \ HRIS | Report Name: Onboarding Metrics | Report Frequency: Monthly | Review\
    \ Frequency: Quarterly"
- id: '1.6'
  name: Process Coverage / Scope
  type: text
  help_text: Clearly define what is INCLUDED and EXCLUDED in this process. Who does
    it apply to? Which departments? Do not include generic company background here;
    keep it specific to the boundaries of this process.
  example: 'Example: "This process covers the end-to-end onboarding of full-time employees
    in the North America region. It excludes contractors and interns."'
- id: '1.7'
  name: Start Point
  type: table
  fields:
  - Activity
  - Entry Criteria
  help_text: Identify the exact trigger that starts this process. What activity happens
    first, and what must be true (Entry Criteria) before you can start?
  example: "Example: \nActivity: Candidate accepts offer | Entry Criteria: Signed\
    \ offer letter uploaded to HRIS"
- id: '1.8'
  name: End Point
  type: table
  fields:
  - Activity
  - Exit Criteria
  help_text: Identify how the process officially concludes. What is the final activity,
    and what is the required condition (Exit Criteria) to consider the process complete?
  example: "Example: \nActivity: Employee IT setup complete | Exit Criteria: Employee\
    \ successfully logs into email and core systems"
- id: '1.9'
  name: Introduction
  type: text
  help_text: Provide a brief context or background for why this process exists. Avoid
    repetitive filler words. This should set the stage, but the specific goals should
    go in the 'Objective' section.
  example: 'Example: "Effective onboarding is critical to employee retention and productivity.
    This process outlines the steps to integrate a new hire into the organization."'
- id: '1.10'
  name: Objective
  type: text
  help_text: State the primary purpose or goal of this process. What is it trying
    to achieve? Keep it concise and specific. Do not simply repeat the Introduction.
  example: 'Example: "To ensure all new employees are fully equipped (IT, payroll,
    access) and oriented within their first 5 days of joining."'
- id: '1.11'
  name: Process Flowchart
  type: file
  help_text: Upload a visual flowchart representing the steps of the process. Ensure
    the major steps in the chart match the steps you will write in the Process Description.
  example: 'Example: (Upload a Visio or draw.io flowchart showing the step-by-step
    onboarding journey)'
- id: '1.12'
  name: Process Description
  type: table
  fields:
  - Sr. No.
  - Activity
  - Description
  - Owner/Role
  - TAT
  help_text: This is the most critical section. List the step-by-step activities of
    the process in logical order. Be specific, assign an owner to each step, and define
    the Turn-Around Time (TAT). Do not use generic filler.
  example: "Example: \nSr. No.: 1 | Activity: Background Check | Description: Initiate\
    \ background verification with 3rd party vendor | Owner/Role: HR Ops | TAT: 2\
    \ days"
- id: '1.13'
  name: RACI Matrix
  type: table
  fields:
  - Roles
  - Responsible (R)
  - Accountable (A)
  - Consulted (C)
  - Informed (I)
  - TAT
  help_text: Define who is Responsible (does the work), Accountable (owns the result),
    Consulted (provides input), and Informed (kept in the loop). Every process must
    have at least one Accountable role.
  example: "Example: \nRoles: HR Manager | Responsible (R): Yes | Accountable (A):\
    \ Yes | Consulted (C): No | Informed (I): No | TAT: 5 days"
- id: '1.14'
  name: Business Rules
  type: table
  fields:
  - Sr. No.
  - Business Rule
  help_text: List the strict rules or policies that govern this process (e.g., 'Approvals
    over $500 require VP sign-off'). Do not put general descriptions here; these must
    be actual rules.
  example: "Example: \nSr. No.: 1 | Business Rule: All IT asset requests must be submitted\
    \ at least 72 hours before the Date of Joining."
- id: '1.15'
  name: Exception and Change Management
  type: table
  fields:
  - Sr. No.
  - Area of Exception
  - Exception Description
  - Exception Mitigation
  - Proposed By
  - Recommended By
  - Approved By
  - Informed To
  - Remarks
  help_text: Identify what happens when the standard process cannot be followed. Describe
    the exception and how it is mitigated. If there are truly no exceptions, state
    'No known exceptions identified'.
  example: "Example: \nSr. No.: 1 | Area: Background Check | Exception Description:\
    \ Vendor delay > 5 days | Exception Mitigation: Conditional joining approved by\
    \ VP | ..."
- id: '1.16'
  name: Risk Management
  type: table
  fields:
  - Sub Process
  - Risk Description
  - Root Cause
  - Type of Risk
  - Risk Impact
  - Level of Risk
  - Control Description
  - Control Frequency
  help_text: Identify potential risks in this process. What could go wrong? What is
    the root cause? Most importantly, define a Control (a mitigation strategy) that
    logically addresses that specific risk.
  example: "Example: \nSub Process: IT Setup | Risk Description: Laptop not delivered\
    \ on day 1 | Root Cause: Late notification to IT | Type: Operational | Risk Impact:\
    \ Low productivity | Level: Medium | Control Description: Automated trigger from\
    \ HRIS to IT | Control Frequency: Per hire"
- id: '1.17'
  name: Compliance Management
  type: table
  fields:
  - Sub Process
  - Compliance Particulars
  - Target Date
  help_text: List any specific regulatory, legal, or organizational compliance requirements
    this process must adhere to. Be specific.
  example: "Example: \nSub Process: I-9 Verification | Compliance Particulars: Form\
    \ I-9 must be completed within 3 days of joining | Target Date: Day 3"
- id: '1.18'
  name: Data Archival
  type: table
  fields:
  - Sub Process
  - Financial Year
  - Document Title
  - Criticality
  - Storage Type
  - Cut-off Period
  - Retention Period
  - Location - hard copy
  - Folder link - soft copy
  help_text: Describe how and where data generated by this process is stored, and
    for how long it must be retained.
  example: "Example: \nSub Process: Offer Letter | Financial Year: 2023-24 | Document\
    \ Title: Signed Offer | Criticality: High | Storage Type: Soft copy | Cut-off\
    \ Period: 1 yr | Retention Period: 7 yrs | Location: N/A | Folder link: /hr/offers"
- id: '1.19'
  name: Abbreviations & Acronyms
  type: table
  fields:
  - Abbreviation
  - Definition
  help_text: Define any acronyms or technical jargon used in this process note to
    ensure clarity for all readers.
  example: "Example: \nAbbreviation: TAT | Definition: Turn-Around Time"
- id: '1.20'
  name: Best Practices Summary
  type: table
  fields:
  - Best Practice Followed
  - Envisaged/Planned
  - Tentative Timelines
  help_text: Highlight current or planned best practices (e.g., 'Automation of data
    entry'). Distinguish clearly between what you are doing now and what is planned
    for the future.
  example: "Example: \nBest Practice Followed: Digital signatures for offer letters\
    \ | Envisaged/Planned: Automated Day 1 welcome email | Tentative Timelines: Q4\
    \ 2023"
- id: '1.21'
  name: Innovations
  type: table
  fields:
  - Innovations Implemented
  - Envisaged/Planned
  - Tentative Timelines
  help_text: List any specific innovations or improvements introduced to make this
    process better. Ensure these are actual improvements, not just normal daily activities.
  example: "Example: \nInnovations Implemented: Replaced manual form with self-service\
    \ HR portal | Envisaged/Planned: AI chatbot for new hire queries | Tentative Timelines:\
    \ Q1 2024"
- id: '1.22'
  name: SIPOC
  type: table
  fields:
  - Supplier (Dept)
  - Input
  - Key Process Step
  - Output
  - Customer (Dept)
  help_text: Define the Suppliers, Inputs, Process Steps, Outputs, and Customers.
    Ensure that the 'Key Process Steps' mentioned here align with what you wrote in
    the 'Process Description' section.
  example: "Example: \nSupplier (Dept): Recruitment | Input: Candidate Details | Key\
    \ Process Step: Trigger Onboarding | Output: Welcome Email | Customer (Dept):\
    \ New Hire"
