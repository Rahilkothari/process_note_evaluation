sections:
- id: '1.1'
  name: Approval Matrix
  type: table
  fields:
  - Name
  - Role
  - Function
  - Sign
  - Date
  help_text: List the key individuals responsible for reviewing and approving this process note. You must include Process Owner and Process Approver (Process Reviewer is optional / recommended). If not applicable for some roles, enter N/A and state why.
  example: "Name: John Doe | Role: Process Owner | Function: HR | Sign: JD | Date: 2023-10-01"
  default_rows:
  - Role: "Process Owner"
  - Role: "Process Reviewer"
  - Role: "Process Approver"

- id: '1.2'
  name: Document Change History
  type: table
  fields:
  - Version No.
  - Effective Date
  - Change Date
  - Change Request By
  - Change Made By
  - Amendment
  help_text: Track the versions of this document. For initial drafts, use 1.0.

- id: '1.3'
  name: Document Review Cycle
  type: table
  fields:
  - Effective Date
  - Next Review Date
  - Process Owner
  - Name
  - Sign
  help_text: Specify how often this process needs to be reviewed (e.g., annually).
  default_rows:
  - Effective Date: ""
    Next Review Date: "1 Year from Effective Date"

- id: '1.4'
  name: Related Documents
  type: table
  fields:
  - Process / Policy ID
  - Document Name
  help_text: List any other organizational policies, guidelines, or process notes that are relevant. Enter 'N/A' if none.

- id: '1.5'
  name: Process Performance Parameters / KPIs
  type: table
  fields:
  - Description
  - Owner
  - Target
  - Maker
  - Checker
  - Data Source
  - Report Name
  - Report Frequency
  - Review Frequency
  help_text: Define the Key Performance Indicators (KPIs) that measure the success. Must be SMART (Specific, Measurable). If this is a small activity with no KPIs, enter 'N/A' in Description and justify why.

- id: '1.6'
  name: Process Coverage / Scope
  type: text
  help_text: Clearly define what is INCLUDED and EXCLUDED in this process. List the specific sub-processes covered here (e.g., 'This note covers Video Translation and Rubrics Eval').

- id: '1.7'
  name: Start Point
  type: table
  fields:
  - Activity
  - Entry Criteria
  help_text: Identify the exact trigger that starts this process.

- id: '1.8'
  name: End Point
  type: table
  fields:
  - Activity
  - Exit Criteria
  help_text: Identify how the process officially concludes.

- id: '1.9'
  name: Introduction
  type: text
  help_text: Provide a brief context or background for why this process exists.

- id: '1.10'
  name: Objective
  type: text
  help_text: State the primary purpose or goal of this process. Keep it concise.

- id: '1.11'
  name: Process Flowchart
  type: flowchart
  help_text: Provide an operational flowchart depicting the actual end-to-end process sequence, decision points, systems used, and hand-offs (matching Section 1.12), rather than theoretical or high-level explanations. You can generate a visual flowchart using AI or upload an image/diagram file.

- id: '1.12'
  name: Process Description
  type: table
  fields:
  - Activity
  - Description
  - Owner/Role
  - TAT
  help_text: "List step-by-step activities broken down into sub-activities. For each activity, specify: 1) Data inputs/sources, 2) Step-by-step procedure, 3) Tools/applications used, 4) Stakeholders & hand-offs, 5) Expected deliverables/outcomes, 6) Checks/approvals."
  example: "Activity: School Selection & Verification | Description: 1. Input: District school list from Gov portal. 2. Sub-steps: Filter criteria applied in Excel, on-ground verification conducted. 3. Tools: State Education Portal, KEF MIS. 4. Handoff: Handed from PH to Verification Lead. 5. Output: Shortlisted verified schools. 6. Check: Verification sign-off by Manager. | Owner/Role: PH & Manager | TAT: 5 Days"

- id: '1.13'
  name: RACI Matrix
  type: table
  fields:
  - Sr. No.
  - Activity name
  - Activity description
  - Timeline
  - Responsible
  - Accountable
  - Consulted by
  - Informed to
  help_text: "Map every activity from Section 1.12 (Process Description). For each activity, specify the exact designation/role (e.g., PH, Manager, Vertical Lead, Director, CEO Project teams) for Responsible, Accountable, Consulted by, and Informed to. DO NOT enter Yes/No."
  example: "Sr. No.: 1 | Activity name: Plan of the Onboarding of the schools | Activity description: 1. Geographical location selection for school onboarding. 2. Liaison with the relevant government authority for coordination. 3. Filter analysis of potential partner schools for partnership | Timeline: Given timeline | Responsible: PH | Accountable: Manager | Consulted by: Director | Informed to: CEO Project teams"

- id: '1.14'
  name: Business Rules
  type: table
  fields:
  - Business Rules
  help_text: "List the strict operational rules, conditions, and governance criteria that must be followed. Every rule must be supported by practical implementation steps in Section 1.12 (explaining who performs the verification/rule enforcement and how)."
  example: "All translated scripts must pass a peer grammar check before recording (enforced by Quality Lead using standard rubric in Section 1.12 Step 3)."

- id: '1.15'
  name: Exception and Change Management
  type: table
  fields:
  - Area of Exception
  - Exception Description
  - Exception Mitigation
  - Prop By
  - Recom By
  - Approved By
  - Informed to
  - Remarks
  help_text: Describe exceptions and mitigations. If no known exceptions, write 'N/A' and provide a brief reason.

- id: '1.16'
  name: Risk Management
  type: table
  fields:
  - Sub Process
  - Risk Description
  - Root Cause
  - Type of Risk
  - Risk Impact
  - Level of Risk
  - Control Description
  - Control frequency
  help_text: Identify potential risks and controls. If no risks exist for an activity, write 'N/A' and justify.

- id: '1.17'
  name: Compliance Management
  type: table
  fields:
  - Sub Process
  - Compliance particulars
  - Target date
  help_text: Regulatory/legal compliance. Enter N/A if none.

- id: '1.18'
  name: Data Archival
  type: table
  fields:
  - Sub Process
  - Financial Year
  - Document Title
  - Criticality
  - Storage Type
  - Cut off Period
  - Retention period
  - Location - hard copy
  - Folder link - soft copy
  help_text: Describe data storage and retention. 

- id: '1.19'
  name: Abbreviations & Acronyms
  type: table
  fields:
  - Abbreviation
  - Definition
  help_text: Define acronyms used.

- id: '1.20'
  name: Best Practices Summary
  type: table
  fields:
  - Best Practices Followed (suggested list)
  - Envisaged/Planned
  - Tentative Timelines
  help_text: Highlight current or planned best practices.

- id: '1.21'
  name: Innovations
  type: table
  fields:
  - Innovations Implemented
  - Envisaged/Planned
  - TENTATIVE TIMELINES
  help_text: Specific innovations introduced.

- id: '1.22'
  name: SIPOC
  type: table
  fields:
  - Supplier (Dept)
  - Input
  - Key Process Step
  - Output
  - Customer (dept)
  help_text: Supplier, Input, Process, Output, Customer.
