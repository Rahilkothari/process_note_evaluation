rules:
- section_id: '1.1'
  name: Approval Matrix
  criteria:
  - Must define the stakeholders responsible for reviewing and approving the Process
    Note at different levels.
  - Must include the Process Owner, Process Reviewer, and Process Approver.
  - Names, Roles, Functions, and Dates must be clearly stated.
- section_id: '1.2'
  name: Document Change History
  criteria:
  - Must record the changes made to the Process Note, including version, date, description
    of change, and person responsible.
  - If this is the first version (1.0), it should be noted appropriately.
  - Amendment descriptions should be clear and not generic.
- section_id: '1.3'
  name: Document Review Cycle
  criteria:
  - Must specify how frequently the Process Note should be reviewed and updated.
  - Next Review Date must logically be after the Effective Date.
  - Responsible stakeholders (Process Owner) must be listed.
- section_id: '1.4'
  name: Related Documents
  criteria:
  - Must list other documents, policies, guidelines, SOPs, or references related to
    the process.
  - Avoid generic descriptions; provide the actual Document Name and ID.
- section_id: '1.5'
  name: Process Performance Parameters / KPIs
  criteria:
  - Defines the key metrics/KPIs used to measure the effectiveness and performance
    of the process.
  - KPI should be measurable (e.g., 'Turnaround time under 24 hours') where applicable.
  - Must have a clear description and identifiable owner.
  - Must have a target where applicable.
  - Must have a data source and appropriate reporting/review frequency.
  flag_generic: true
- section_id: '1.6'
  name: Process Coverage / Scope
  criteria:
  - Specifies what is included and excluded from the process and the areas, teams, or activities covered.
  - Must explicitly delineate both IN-SCOPE activities/locations and OUT-OF-SCOPE exclusions.
  - Clearly describes operational boundaries. Who does it apply to? Which departments/programs?
  - Must not be overly brief, vague, or superficial (at least 20 words with clear boundary definitions).
  flag_generic: true
- section_id: '1.7'
  name: Start Point
  criteria:
  - Defines the event, request, or activity that triggers the beginning of the process.
  - Explains what must be true before the activity begins (Entry Criteria).
  - Activity and Entry Criteria logically relate.
- section_id: '1.8'
  name: End Point
  criteria:
  - Defines the event or outcome that indicates the completion of the process.
  - Identifies the required condition (Exit Criteria) to consider the process complete.
- section_id: '1.9'
  name: Introduction
  criteria:
  - Provides a substantive background context and explains why standardizing this process is essential for the organization.
  - Must cover the operational setting, challenges or risks addressed, and rationale for standardization.
  - Must not be overly brief or superficial (at least 25 words).
  - Does not merely repeat the Objective.
- section_id: '1.10'
  name: Objective
  criteria:
  - States the substantive purpose of the process and the intended operational outcome or goal to be achieved.
  - Must specify tangible, measurable business outcomes and targets (e.g., TAT thresholds, error reduction, quality benchmarks, compliance goals).
  - Must not be superficial, generic, or overly brief (at least 20 words with clear success benchmarks).
  - Does not merely repeat the Introduction.
- section_id: '1.11'
  name: Process Flowchart
  criteria:
  - Must depict the actual operational process flow rather than a theoretical or high-level explanation.
  - Must visually represent the actual steps, sequence, decision points, and hand-offs described in the Process Description (1.12).
  - Sequence and flow logic must match the operational timeline.
- section_id: '1.12'
  name: Process Description
  criteria:
  - Provides a clear, detailed, and easy-to-understand end-to-end description of the process.
  - Each major activity must be broken down into sub-activities to ensure the end-to-end process is adequately documented.
  - Must cover the source of data or inputs required for each activity.
  - Must provide detailed steps explaining how each activity is performed.
  - Must specify the tools, applications, and systems used at each stage (e.g., portals, software, ERP, spreadsheets).
  - Must specify the teams or stakeholders involved and the hand-offs between them.
  - Must specify the expected outcome or deliverable of each activity and the overall process.
  - Must specify checks, validations, and approvals wherever applicable.
  - Each step must have an owner/role assigned and a defined Turn-Around Time (TAT).
- section_id: '1.13'
  name: RACI Matrix
  criteria:
  - RACI Matrix must follow the standard format: Sr. No., Activity name, Activity description, Timeline, Responsible, Accountable, Consulted by, Informed to.
  - Activities mentioned in the Process Description (1.12) must also be reflected in the RACI Matrix.
  - Relevant designations and job titles (e.g. PH, Manager, Vertical Lead, Director, CEO Project teams) must be specified for R, A, C, and I roles instead of Yes/No responses or checkmarks.
  - Every activity must have clear single Accountable (A) ownership.
- section_id: '1.14'
  name: Business Rules
  criteria:
  - Lists the strict operational rules, policies, and conditions that govern the process.
  - Every Business Rule must be adequately supported and implemented by operational steps in the Process Description (1.12).
  - If a rule is stated (e.g., peer grammar check, multi-level sign-off), the process for conducting that check, who performs it, and how it is completed must be documented in Section 1.12. Gaps must be flagged.
- section_id: '1.15'
  name: Exception and Change Management
  criteria:
  - Describes how exceptions, deviations, and changes to the standard process should
    be identified, handled, and documented.
  - Logical completeness (Exception exists -> Description -> Mitigation).
  - If there are no exceptions, it should explicitly state 'No known exceptions identified'.
- section_id: '1.16'
  name: Risk Management
  criteria:
  - Identifies potential risks associated with the process and defines measures to
    prevent, mitigate, or manage them.
  - Logical relationships between Risk, Root Cause, Impact, and Control.
  - Controls should actually address the specific risk.
- section_id: '1.17'
  name: Compliance Management
  criteria:
  - Specifies the applicable laws, regulations, policies, standards, and internal
    requirements that the process must comply with.
  - Compliance items are specific.
  - Target dates are valid where applicable.
  - Entries are actual compliance requirements, not generic statements.
- section_id: '1.18'
  name: Data Archival
  criteria:
  - Defines the data/documents that need to be retained, the retention period, storage
    location, and archival method.
  - Must specify the Storage Type (hard copy or soft copy) and Cut-off Period.
- section_id: '1.19'
  name: Abbreviations & Acronyms
  criteria:
  - Provides the full forms and meanings of abbreviations and acronyms used in the
    Process Note.
  - Definitions are plausible and clear.
  - Same abbreviation is defined consistently.
- section_id: '1.20'
  name: Best Practices Summary
  criteria:
  - Highlights recommended practices that help ensure the process is performed efficiently
    and consistently.
  - Distinguishes clearly between what is existing/followed, and what is envisaged/planned
    for the future.
- section_id: '1.21'
  name: Innovations
  criteria:
  - Captures new ideas, improvements, technology, or innovative approaches introduced
    or suggested for the process.
  - Entry actually represents an innovation/improvement rather than normal process
    activity.
- section_id: '1.22'
  name: SIPOC
  criteria:
  - Provides a high-level overview of the process by identifying Suppliers, Inputs,
    Process Steps, Outputs, and Customers.
  - The 'Key Process Steps' mentioned here must align with the 'Process Description'
    section.
